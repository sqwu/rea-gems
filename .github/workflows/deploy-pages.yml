name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "assets/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/assets
          cp docs/index.html _site/index.html
          cp data/cases.json _site/data/cases.json
          cp assets/logo.svg _site/assets/logo.svg
          cp assets/og-cover.svg _site/assets/og-cover.svg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
