  <!-- name + one-line description -->
  <text x="640" y="415" text-anchor="middle"
        font-family="-apple-system,'SF Pro Display','Helvetica Neue','Segoe UI',sans-serif"
        font-size="88" font-weight="700" letter-spacing="-2.5" fill="#1d1d1f">REA Gems</text>
  <text x="640" y="472" text-anchor="middle"
