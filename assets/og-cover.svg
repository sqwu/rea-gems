    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0"/>
